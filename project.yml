name: ClawdBar
options:
  bundleIdPrefix: com.rossnicholson
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

packages:
  HouseStyle:
    url: https://github.com/RossNicholson/mac-house-style
    from: 1.0.0

targets:
  ClawdBar:
    type: application
    platform: macOS
    sources:
      - path: ClawdBar
    dependencies:
      - package: HouseStyle
    info:
      path: ClawdBar/Info.plist
      properties:
        CFBundleDisplayName: ClawdBar
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "15"
        LSUIElement: true
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_NAME: ClawdBar
        PRODUCT_BUNDLE_IDENTIFIER: com.rossnicholson.ClawdBar
        CODE_SIGN_ENTITLEMENTS: ClawdBar/ClawdBar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "5HQ5V9NP82"
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - ClawdBarTests

  ClawdBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClawdBarTests
    dependencies:
      - target: ClawdBar
